name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  RUN_CLAUDE_CHARACTERIZATION: ""
  CLAUDE_CHARACTERIZATION_ACK_COST: ""

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"
          python -m pip install build

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      - name: Test
        run: >-
          python -m pytest
          --cov=hermes_claude_sessions
          --cov-branch
          --cov-fail-under=80

      - name: Compile
        run: python -m compileall -q hermes_claude_sessions tests

      - name: Build
        run: python -m build

      - name: Inspect wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          required = {
              "hermes_claude_sessions/claude_plugin/.claude-plugin/plugin.json",
              "hermes_claude_sessions/claude_plugin/hooks/hooks.json",
              "hermes_claude_sessions/claude_plugin/hooks/event_bridge.py",
              "hermes_claude_sessions/claude_plugin/hooks/permission_bridge.py",
          }
          assert required <= set(names), required - set(names)
          assert not any(name.startswith(("tests/", "skills/")) for name in names)
          assert any(name.endswith("LICENSE") for name in names)
          PY
