[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-claude-sessions"
version = "0.5.3"
description = "Hermes-managed native Claude sessions with autonomous permission routing"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_claude_sessions*"]
exclude = ["tests*", "skills*"]
namespaces = false

[tool.setuptools.package-data]
hermes_claude_sessions = [
  "claude_plugin/.claude-plugin/plugin.json",
  "claude_plugin/hooks/hooks.json",
  "claude_plugin/hooks/event_bridge.py",
  "claude_plugin/hooks/permission_bridge.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
files = ["hermes_claude_sessions"]
